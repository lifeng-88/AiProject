<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Manrope:wght@400;500;700&amp;family=Space+Grotesk:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-tint": "#c59aff",
              "primary-fixed-dim": "#b075ff",
              "on-tertiary-fixed": "#380017",
              "surface-container-highest": "#242436",
              "on-surface": "#e6e3f5",
              "tertiary-fixed": "#ff8eae",
              "secondary-dim": "#efc900",
              "tertiary": "#ff6b9b",
              "on-tertiary": "#47001f",
              "outline": "#757483",
              "surface-dim": "#0d0d19",
              "outline-variant": "#474755",
              "surface-container-high": "#1e1e2e",
              "primary-container": "#ba88ff",
              "surface-container": "#181827",
              "on-secondary-fixed": "#453900",
              "secondary-container": "#705d00",
              "surface-variant": "#242436",
              "on-primary-fixed-variant": "#3f007c",
              "tertiary-dim": "#e30071",
              "surface-container-low": "#12121f",
              "inverse-on-surface": "#545462",
              "on-primary": "#420082",
              "on-primary-fixed": "#000000",
              "error-dim": "#d73357",
              "tertiary-container": "#ff067f",
              "surface-bright": "#2a2a3d",
              "on-error-container": "#ffb2b9",
              "primary-fixed": "#ba88ff",
              "secondary": "#ffd709",
              "secondary-fixed-dim": "#efc900",
              "on-secondary-container": "#fff7e6",
              "surface-container-lowest": "#000000",
              "background": "#0d0d19",
              "on-secondary": "#5b4b00",
              "inverse-surface": "#fcf8ff",
              "primary": "#c59aff",
              "primary-dim": "#9547f7",
              "on-tertiary-container": "#000000",
              "inverse-primary": "#7e29df",
              "on-background": "#e6e3f5",
              "error-container": "#a70138",
              "on-secondary-fixed-variant": "#665500",
              "on-error": "#490013",
              "on-tertiary-fixed-variant": "#760037",
              "on-primary-container": "#330066",
              "error": "#ff6e84",
              "surface": "#0d0d19",
              "secondary-fixed": "#ffd709",
              "tertiary-fixed-dim": "#ff75a0",
              "on-surface-variant": "#aba9ba"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Manrope"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(36, 36, 54, 0.6);
            backdrop-filter: blur(20px);
        }
        .ghost-border {
            border: 1px solid rgba(71, 71, 85, 0.2);
        }
        .glow-primary {
            box-shadow: 0 0 30px rgba(197, 154, 255, 0.25);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen overflow-hidden">
<!-- Background Layer (Home Screen Mock - Slightly Dimmed) -->
<div class="fixed inset-0 z-0 px-6 pt-20 flex flex-col gap-8 opacity-30 grayscale-[0.3] scale-100 blur-[2px]">
<!-- Top Nav Mock -->
<header class="flex justify-between items-center w-full h-16">
<div class="text-xl font-headline font-bold tracking-tighter text-primary">Aetheric AI</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
</header>
<!-- Bento Grid Mock Content -->
<div class="grid grid-cols-2 gap-4 h-full pb-32">
<div class="col-span-2 aspect-[16/9] rounded-xl bg-surface-container-low relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent opacity-60"></div>
</div>
<div class="aspect-square rounded-xl bg-surface-container-low"></div>
<div class="aspect-square rounded-xl bg-surface-container-low"></div>
<div class="col-span-2 h-40 rounded-xl bg-surface-container-low"></div>
</div>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-[#0d0d19]/85 backdrop-blur-sm px-6">
<!-- SUCCESS POPUP CONTAINER - Increased corner radius to 28px -->
<div class="w-full max-w-[340px] bg-surface-container-high rounded-[28px] p-8 pb-10 flex flex-col items-center text-center ghost-border relative overflow-hidden shadow-[0_32px_64px_rgba(0,0,0,0.7)] gap-4">
<!-- Close Button (X) -->
<button class="absolute top-5 right-5 text-on-surface-variant hover:text-white transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Ambient Glow Background Decor -->
<div class="absolute -top-12 -left-12 w-32 h-32 bg-primary/15 rounded-full blur-[40px]"></div>
<!-- 1. Headline -->
<h2 class="font-headline font-bold text-sm uppercase tracking-[0.2em] text-primary mt-4 mb-8">RECHARGE SUCCESS</h2>
<!-- 2. Content -->
<div class="flex flex-col gap-2 mb-10">
<div class="flex items-center justify-center gap-3 whitespace-nowrap mb-1">
<span class="material-symbols-outlined text-secondary fill-1 text-[28px]">monetization_on</span>
<h3 class="font-headline font-bold text-[22px] leading-tight text-white tracking-tight">500 COINS RECEIVED</h3>
</div>
<p class="font-label text-[12px] font-bold tracking-[0.15em] text-secondary">
                +100 BONUS INCLUDED
            </p>
</div>
<!-- 3. Actions -->
<div class="w-full">
<button class="w-full py-4.5 bg-gradient-to-r from-primary-dim to-primary rounded-full text-on-primary-fixed font-headline font-bold text-[15px] tracking-wide shadow-[0_8px_24px_rgba(149,71,247,0.4)] active:scale-[0.96] transition-transform py-4">
                GET STARTED
            </button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar (Purple Glassmorphism Style) -->
<nav class="fixed bottom-6 left-6 right-6 z-50 h-20 bg-[#242436]/60 backdrop-blur-2xl ghost-border rounded-[2.5rem] flex items-center justify-between px-8 shadow-[0_12px_40px_rgba(0,0,0,0.5)]">
<!-- Home Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[24px]">auto_awesome</span>
<span class="text-[10px] uppercase tracking-widest font-bold font-label mt-1">Home</span>
</div>
<!-- Recharge Tab (Active) -->
<div class="flex flex-col items-center justify-center text-primary relative">
<div class="absolute -top-3 w-10 h-1 bg-primary rounded-full blur-[2px]"></div>
<span class="material-symbols-outlined text-[26px] fill-1">payments</span>
<span class="text-[10px] uppercase tracking-widest font-bold font-label mt-1">Recharge</span>
</div>
<!-- My/Profile Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[24px]">person</span>
<span class="text-[10px] uppercase tracking-widest font-bold font-label mt-1">My</span>
</div>
</nav>
</body></html>
