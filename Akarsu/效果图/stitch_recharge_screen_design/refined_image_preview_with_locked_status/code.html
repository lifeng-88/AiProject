<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(36, 36, 54, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(71, 71, 85, 0.2);
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-surface-dim text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-[#181827]">
<div class="flex items-center gap-4">
<button class="text-[#c59aff] hover:bg-[#242436] transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-extrabold text-[#c59aff] font-headline tracking-tight">Preview</h1>
</div>
<div class="flex items-center gap-2 bg-surface-container-high px-3 py-1.5 rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-xl" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
<span class="text-sm font-label font-bold text-on-surface">1,250</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-4 max-w-lg mx-auto w-full flex flex-col items-center pb-8">
<!-- Composition Container -->
<div class="relative w-full max-w-sm mb-8">
<!-- Target Template (Larger Primary Image) - 9:16 Ratio -->
<div class="relative w-full aspect-[9/16] rounded-xl overflow-hidden border border-outline-variant/30 shadow-2xl bg-surface-container-highest">
<img alt="Target template image" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJwdElfYCzYE6mx8OtVsH5iJrA5JYBU8awOkWS_lVd5pVbQGL9I3in950ICQ4we_lDaFraaQXo0nxWl3HSqQV5Ot9K6hI9lqHb8wb8CsTuOpZ_ozGAspq6-rA_fTd9NSQbg77_67ZpO24vSf2KvzQsbSvQRPcM89hMezR89tGnFfet4c2X7BMPGElGtvEejapxtgUTCNw-BdYh6llK3ApQ-bUoGqzF23v7VXyiTELHeFwHHFBkZ0umy1vmwyCkG1QZkRB2NZbRfiQN"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<div class="absolute left-4 top-4">
<span class="text-[10px] font-label font-bold uppercase tracking-widest text-secondary px-2 py-1 bg-black/40 backdrop-blur-md border border-secondary/30 rounded-sm">Target</span>
</div>
<button class="absolute right-4 top-4 w-10 h-10 flex items-center justify-center rounded-full glass-panel border border-primary/20 shadow-[0_0_15px_rgba(197,154,255,0.2)] hover:shadow-[0_0_20px_rgba(197,154,255,0.4)] transition-all duration-300 group">
<span class="material-symbols-outlined text-primary text-xl group-hover:scale-110 transition-transform duration-300" style="font-variation-settings: 'FILL' 0, 'wght' 400;">favorite</span>
</button></div>
<!-- Your Photo (Overlapping Secondary Image) - 9:16 Ratio -->
<div class="absolute bottom-[-24px] right-0 w-36 aspect-[9/16] rounded-xl overflow-hidden border-2 border-surface-container shadow-2xl z-10 bg-surface-container-highest">
<img alt="Source image" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsqqmTCnR_7K9GbvP_sVllBz20ATOYl5koKhvtrPo0eaJZpUrW9BVoTUPnnN4r-2FULboRWrXdEIUd6G0ZvjU03TiLJ6ZblT2hB3JpKwNwnSEUis5LyxziPn5J4gQ0ign2yZ0NPrW6Upoxq6SLr-PVANAj4eZvJ1hRecJB31ykra5QwReBytNZ7Tw_o9-CEW1B71-NL0fhwdS8gScHI5_QuFfvfcxX0uyOxB8jzzFWFPzdXlMrT1WUr_tJ5ty6AL9HgwAra7hT-X5U"/>
<!-- Connection/Swap Icon - Positioned at top-left of source image -->
<div class="absolute -top-6 -left-6 z-20">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center border-4 border-surface-dim shadow-[0_0_20px_rgba(197,154,255,0.6)] ring-1 ring-primary/30">
<span class="material-symbols-outlined text-on-primary text-2xl font-bold">swap_calls</span>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col gap-4 mt-auto">
<button class="w-full py-5 bg-gradient-to-r from-primary-dim to-primary text-on-primary-container font-headline font-extrabold text-lg tracking-tight shadow-[0_8px_32px_rgba(149,71,247,0.3)] active:scale-95 transition-transform duration-150 flex items-center justify-center gap-3 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_fix_high</span>
<span class="flex items-center gap-2">GENERATE
<span class="h-4 w-px bg-white/20 mx-2"></span>
<span class="material-symbols-outlined text-white text-lg" style="font-variation-settings: 'FILL' 1;">lock</span></span>
</button>
</div>
</main>
</body></html>
