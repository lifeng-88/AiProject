<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Digital Curator - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Manrope:wght@500;600;700&amp;family=Space+Grotesk:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0d0d19;
            color: #e6e3f5;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-pill {
            background: rgba(36, 36, 54, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(71, 71, 85, 0.2);
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 2s linear infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-container": "#ba88ff",
                        "primary": "#c59aff",
                        "surface-container": "#181827",
                        "outline": "#757483",
                        "background": "#0d0d19",
                        "on-surface": "#e6e3f5",
                        "secondary-fixed-dim": "#efc900",
                        "error-container": "#a70138",
                        "primary-fixed": "#ba88ff",
                        "surface-bright": "#2a2a3d",
                        "on-secondary-fixed": "#453900",
                        "secondary-container": "#705d00",
                        "on-primary-container": "#330066",
                        "surface-variant": "#242436",
                        "outline-variant": "#474755",
                        "on-error": "#490013",
                        "on-secondary": "#5b4b00",
                        "surface-container-lowest": "#000000",
                        "inverse-surface": "#fcf8ff",
                        "secondary-fixed": "#ffd709",
                        "on-tertiary-fixed": "#380017",
                        "on-primary": "#420082",
                        "on-primary-fixed": "#000000",
                        "on-tertiary-fixed-variant": "#760037",
                        "surface-dim": "#0d0d19",
                        "primary-fixed-dim": "#b075ff",
                        "tertiary-fixed-dim": "#ff75a0",
                        "inverse-on-surface": "#545462",
                        "inverse-primary": "#7e29df",
                        "surface-tint": "#c59aff",
                        "on-background": "#e6e3f5",
                        "tertiary-container": "#ff067f",
                        "tertiary": "#ff6b9b",
                        "surface-container-high": "#1e1e2e",
                        "on-surface-variant": "#aba9ba",
                        "secondary-dim": "#efc900",
                        "on-error-container": "#ffb2b9",
                        "primary-dim": "#9547f7",
                        "on-tertiary-container": "#000000",
                        "surface-container-low": "#12121f",
                        "tertiary-dim": "#e30071",
                        "on-secondary-container": "#fff7e6",
                        "on-tertiary": "#47001f",
                        "surface-container-highest": "#242436",
                        "secondary": "#ffd709",
                        "surface": "#0d0d19",
                        "on-secondary-fixed-variant": "#665500",
                        "on-primary-fixed-variant": "#3f007c",
                        "error-dim": "#d73357",
                        "tertiary-fixed": "#ff8eae",
                        "error": "#ff6e84"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body selection:bg-primary selection:text-on-primary">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 backdrop-blur-md bg-gradient-to-b from-black/80 to-transparent">
<div class="flex items-center justify-between h-14 px-4">
<!-- Left: List toggle icon -->
<button class="hover:bg-[#242436] transition-colors p-1.5 rounded-full active:scale-95 duration-150 flex-shrink-0">
<span class="material-symbols-outlined text-[#c59aff] text-[20px]">menu</span>
</button>
<!-- Center: First-level TABs -->
<div class="flex gap-6 items-center flex-grow justify-center">
<div class="relative py-3.5">
<button class="text-[13px] font-bold font-headline transition-all text-primary whitespace-nowrap">Image</button>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-primary rounded-full"></div>
</div>
<button class="text-[13px] font-bold font-headline transition-all text-on-surface-variant hover:text-primary whitespace-nowrap opacity-60">Video</button>
<button class="text-[13px] font-bold font-headline transition-all text-on-surface-variant hover:text-primary whitespace-nowrap opacity-60">Dance</button>
</div>
<!-- Right: Coin balance -->
<div class="flex items-center gap-1 bg-surface-container-high px-2.5 py-1 rounded-full border border-outline-variant/10 shadow-sm hover:bg-[#242436] transition-colors cursor-pointer flex-shrink-0">
<span class="material-symbols-outlined text-secondary text-[14px]" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
<span class="font-label text-[10px] font-bold tracking-tight text-on-surface">1,250</span>
</div>
</div>
<!-- Second-level TABs: Scroller style -->
<div class="flex gap-2 px-4 pb-3 overflow-x-auto hide-scrollbar">
<button class="px-5 py-1.5 rounded-full bg-surface-container-highest text-primary text-[10px] font-bold font-label uppercase tracking-wider border border-primary/20">Cyberpunk</button>
<button class="px-5 py-1.5 rounded-full bg-surface-container/40 text-on-surface-variant text-[10px] font-bold font-label uppercase tracking-wider border border-outline-variant/10 hover:bg-surface-container-high">Sci-Fi</button>
</div>
</header>
<!-- Main Content: Loading Screen -->
<main class="h-screen w-full flex flex-col justify-center items-center bg-background relative overflow-hidden">
<!-- Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary/10 rounded-full blur-[100px]"></div>
<!-- Loading Spinner -->
<div class="relative flex flex-col items-center gap-6">
<div class="relative">
<!-- Outer Glow Ring -->
<div class="absolute inset-0 rounded-full blur-xl bg-primary/30 animate-pulse"></div>
<!-- Spinner SVG -->
<svg class="animate-spin-slow h-16 w-16 text-primary relative z-10" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-10" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-90" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<!-- Loading Text -->
<span class="font-headline font-extrabold text-[10px] tracking-[0.3em] text-primary/80 uppercase">Loading...</span>
</div>
</main>
<!-- Bottom Navigation Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-3 bg-[#181827]/80 backdrop-blur-xl rounded-t-[3rem] border-t border-[#474755]/20 shadow-[0_-10px_50px_rgba(138,43,226,0.15)]">
<!-- Home Tab (Active) -->
<a class="flex flex-col items-center justify-center bg-[#c59aff]/10 text-[#c59aff] rounded-full px-6 py-2 shadow-[0_0_20px_rgba(197,154,255,0.2)] transition-all active:scale-90 min-w-[80px]" href="#">
<span class="material-symbols-outlined" data-weight="fill">home</span>
<span class="font-body font-semibold text-[10px] uppercase tracking-tighter mt-0.5">Home</span>
</a>
<!-- Recharge Tab -->
<a class="flex flex-col items-center justify-center text-[#e6e3f5]/50 hover:text-[#c59aff] transition-all active:scale-90 min-w-[80px]" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-body font-semibold text-[10px] uppercase tracking-tighter mt-0.5">Recharge</span>
</a>
<!-- My Tab -->
<a class="flex flex-col items-center justify-center text-[#e6e3f5]/50 hover:text-[#c59aff] transition-all active:scale-90 min-w-[80px]" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-body font-semibold text-[10px] uppercase tracking-tighter mt-0.5">My</span>
</a>
</footer>
</body></html>
