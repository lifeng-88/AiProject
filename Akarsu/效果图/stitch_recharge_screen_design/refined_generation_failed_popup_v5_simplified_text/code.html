<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;family=Space_Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-dim": "#e30071",
              "on-background": "#e6e3f5",
              "tertiary": "#ff6b9b",
              "surface-container": "#181827",
              "secondary-fixed-dim": "#efc900",
              "primary-dim": "#9547f7",
              "primary-fixed": "#ba88ff",
              "on-tertiary-fixed-variant": "#760037",
              "on-secondary-fixed": "#453900",
              "surface-container-high": "#1e1e2e",
              "background": "#0d0d19",
              "on-tertiary": "#47001f",
              "secondary-dim": "#efc900",
              "on-surface-variant": "#aba9ba",
              "on-surface": "#e6e3f5",
              "on-secondary": "#5b4b00",
              "on-primary-container": "#330066",
              "secondary-fixed": "#ffd709",
              "surface-tint": "#c59aff",
              "secondary": "#ffd709",
              "error-dim": "#d73357",
              "primary-container": "#ba88ff",
              "surface-dim": "#0d0d19",
              "error": "#ff6e84",
              "on-secondary-fixed-variant": "#665500",
              "inverse-on-surface": "#545462",
              "outline-variant": "#474755",
              "secondary-container": "#705d00",
              "surface-container-lowest": "#000000",
              "on-secondary-container": "#fff7e6",
              "on-error": "#490013",
              "tertiary-fixed-dim": "#ff75a0",
              "tertiary-container": "#ff067f",
              "outline": "#757483",
              "surface-container-highest": "#242436",
              "surface": "#0d0d19",
              "on-error-container": "#ffb2b9",
              "primary-fixed-dim": "#b075ff",
              "on-primary-fixed-variant": "#3f007c",
              "surface-variant": "#242436",
              "primary": "#c59aff",
              "on-primary": "#420082",
              "inverse-surface": "#fcf8ff",
              "on-tertiary-fixed": "#380017",
              "inverse-primary": "#7e29df",
              "surface-container-low": "#12121f",
              "surface-bright": "#2a2a3d",
              "on-tertiary-container": "#000000",
              "tertiary-fixed": "#ff8eae",
              "on-primary-fixed": "#000000",
              "error-container": "#a70138"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Manrope"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-modal {
        background: rgba(24, 24, 39, 0.9);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .neon-glow {
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(149, 71, 247, 0.1);
      }
      .ghost-border {
        border: 1px solid rgba(197, 154, 255, 0.1);
      }
      .pill-gradient {
        background: linear-gradient(135deg, #b075ff 0%, #9547f7 100%);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 8px 16px rgba(149, 71, 247, 0.4);
      }
    </style>
</head>
<body class="bg-background text-on-background font-body selection:bg-primary/30 min-h-screen overflow-hidden">
<!-- Background UI Layer -->
<main class="fixed inset-0 z-0 flex flex-col pt-16 pb-24 px-6 opacity-20 grayscale blur-md pointer-events-none">
<header class="flex justify-between items-center mb-8">
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-primary">Generating...</h1>
</header>
<div class="grid grid-cols-2 gap-4 flex-1 content-start">
<div class="aspect-square rounded-lg bg-surface-container-highest overflow-hidden relative"></div>
<div class="aspect-square rounded-lg bg-surface-container-highest border border-outline-variant/20"></div>
</div>
</main>
<!-- Top App Bar (Shared Component) -->
<nav class="flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-[#181827]/60 backdrop-blur-md">
<div class="flex items-center gap-4">
<button class="text-[#c59aff] p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="text-xl font-extrabold text-[#c59aff] font-['Plus_Jakarta_Sans'] tracking-tight">FaceSwap AI</span>
</div>
<button class="text-[#c59aff] p-2 rounded-full">
<span class="material-symbols-outlined">history</span>
</button>
</nav>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 z-[60] bg-background/90 backdrop-blur-sm flex items-center justify-center p-8">
<!-- Failure Popup Modal -->
<div class="glass-modal neon-glow ghost-border w-full max-w-[340px] rounded-[28px] overflow-hidden relative active:scale-100 transition-transform duration-300">
<!-- Close Button -->
<button class="absolute top-5 right-5 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Modal Content -->
<div class="p-8 pt-10 flex flex-col items-center text-center">
<!-- Error Icon -->
<div class="w-16 h-16 bg-error/10 rounded-full flex items-center justify-center mb-5">
<span class="material-symbols-outlined text-error text-4xl" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<h2 class="font-headline text-xl font-bold tracking-tight text-on-background mb-2 uppercase">
                Generation Failed
            </h2>
<p class="font-body text-[13px] text-on-surface-variant leading-relaxed px-6 mb-8">An unexpected error occurred. Coins have been refunded.</p>
<!-- Actions -->
<div class="w-full space-y-3">
<button class="w-full py-3.5 px-6 rounded-full pill-gradient text-white font-headline font-bold text-base active:scale-[0.97] transition-all duration-150 tracking-wide uppercase">
                    Regenerate
                </button>
<button class="w-full py-2 px-6 rounded-xl text-on-surface-variant/70 font-label text-[11px] uppercase tracking-[0.15em] hover:text-primary transition-colors active:scale-95">
                    Back to Home
                </button>
</div>
</div>
</div>
</div>
<!-- Bottom Nav Bar (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#0d0d19]/80 backdrop-blur-xl rounded-t-[3rem]">
<div class="flex flex-col items-center justify-center bg-[#242436] text-[#c59aff] rounded-full p-3 shadow-[0_0_15px_rgba(197,154,255,0.15)]">
<span class="material-symbols-outlined">auto_awesome</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest mt-1">Studio</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e6e3f5]/40 p-3">
<span class="material-symbols-outlined">dashboard_customize</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest mt-1">Templates</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e6e3f5]/40 p-3">
<span class="material-symbols-outlined">photo_library</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest mt-1">Gallery</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e6e3f5]/40 p-3">
<span class="material-symbols-outlined">auto_fix_high</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest mt-1">Pro</span>
</div>
</nav>
</body></html>
