<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-container": "#fff7e6",
              "inverse-on-surface": "#545462",
              "on-primary": "#420082",
              "surface-tint": "#c59aff",
              "outline": "#757483",
              "secondary-fixed-dim": "#efc900",
              "primary-fixed": "#ba88ff",
              "on-secondary-fixed": "#453900",
              "on-tertiary-fixed-variant": "#760037",
              "secondary-container": "#705d00",
              "error-container": "#a70138",
              "on-surface-variant": "#aba9ba",
              "tertiary-fixed": "#ff8eae",
              "surface-container-low": "#12121f",
              "surface-dim": "#0d0d19",
              "on-tertiary-fixed": "#380017",
              "on-tertiary": "#47001f",
              "primary-container": "#ba88ff",
              "error-dim": "#d73357",
              "on-error-container": "#ffb2b9",
              "surface-container-lowest": "#000000",
              "on-surface": "#e6e3f5",
              "surface-container": "#181827",
              "primary-dim": "#9547f7",
              "on-tertiary-container": "#000000",
              "inverse-surface": "#fcf8ff",
              "on-primary-container": "#330066",
              "on-primary-fixed": "#000000",
              "secondary-fixed": "#ffd709",
              "surface-variant": "#242436",
              "secondary-dim": "#efc900",
              "surface": "#0d0d19",
              "surface-container-highest": "#242436",
              "surface-bright": "#2a2a3d",
              "inverse-primary": "#7e29df",
              "on-secondary-fixed-variant": "#665500",
              "error": "#ff6e84",
              "on-error": "#490013",
              "secondary": "#ffd709",
              "tertiary-fixed-dim": "#ff75a0",
              "tertiary-container": "#ff067f",
              "on-background": "#e6e3f5",
              "on-primary-fixed-variant": "#3f007c",
              "on-secondary": "#5b4b00",
              "primary": "#c59aff",
              "primary-fixed-dim": "#b075ff",
              "tertiary-dim": "#e30071",
              "background": "#0d0d19",
              "surface-container-high": "#1e1e2e",
              "tertiary": "#ff6b9b",
              "outline-variant": "#474755"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Manrope"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .glow-sm {
            box-shadow: 0 0 15px -3px rgba(197, 154, 255, 0.3);
        }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s ease-in-out infinite;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0d0d19] dark:bg-[#0d0d19] text-[#c59aff]">
<div class="flex items-center gap-4">
<button class="hover:bg-[#242436]/50 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight">My Creations</h1>
</div>
</header>
<main class="pt-20 px-4 flex flex-col min-h-screen pb-12">
<!-- Tab Bar -->
<nav class="flex items-center gap-2 overflow-x-auto pb-4 custom-scrollbar">
<button class="flex-none px-6 py-2 rounded-full bg-primary/10 text-primary font-bold font-label text-xs tracking-widest border border-primary/20 glow-sm">
                ALL
            </button>
<button class="flex-none px-6 py-2 rounded-full bg-surface-container-low text-on-surface/40 font-semibold font-label text-xs tracking-widest hover:text-on-surface transition-colors">
                GENERATING
            </button>
<button class="flex-none px-6 py-2 rounded-full bg-surface-container-low text-on-surface/40 font-semibold font-label text-xs tracking-widest hover:text-on-surface transition-colors">
                SUCCESS
            </button>
<button class="flex-none px-6 py-2 rounded-full bg-surface-container-low text-on-surface/40 font-semibold font-label text-xs tracking-widest hover:text-on-surface transition-colors">
                FAILURE
            </button>
</nav>
<!-- Expiration Notice (Weakened) -->
<div class="mb-4 px-2 flex items-center gap-2 opacity-30">
<span class="material-symbols-outlined text-on-surface text-[10px]" data-icon="info">info</span>
<p class="text-[9px] leading-none text-on-surface font-medium uppercase tracking-wider">
                Works expire after 24h. Please save them in time.
            </p>
</div>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center -mt-20">
<!-- Refined Illustration -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
<div class="relative w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center border border-primary/10 shadow-2xl">
<span class="material-symbols-outlined text-primary text-5xl animate-pulse-subtle" data-icon="auto_awesome">auto_awesome</span>
</div>
</div>
<!-- Empty State Text -->
<p class="text-on-surface/70 text-sm font-medium tracking-tight whitespace-nowrap px-4 mb-8">
                Start your AI journey and bring your ideas to life.
            </p>
<!-- CTA Button -->
<button class="group relative px-10 py-3.5 overflow-hidden rounded-full transition-all hover:scale-105 active:scale-95">
<div class="absolute inset-0 bg-gradient-to-r from-[#9547f7] to-[#c59aff]"></div>
<div class="relative flex items-center gap-2">
<span class="text-on-primary font-label font-bold text-sm uppercase tracking-widest">Start Creating</span>
<span class="material-symbols-outlined text-on-primary text-lg transition-transform group-hover:translate-x-1" data-icon="rocket_launch">rocket_launch</span>
</div>
</button>
</div>
</main>
</body></html>
