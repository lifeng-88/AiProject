<!-- Modal Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-surface/80 backdrop-blur-sm">
<!-- Feedback Modal Container -->
<!-- Corner radius 4px as requested: rounded-[4px] -->
<div class="relative w-full max-w-[420px] bg-[#181827] shadow-[0_20px_60px_rgba(0,0,0,0.6)] rounded-[4px] overflow-hidden border border-outline-variant/20 transition-all duration-300">
<!-- Header -->
<div class="px-6 pt-6 pb-2"><div class="absolute top-6 right-6"><button class="text-on-surface-variant/60 hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-[20px]">close</span></button></div>
<h2 class="font-headline font-bold text-[10px] tracking-[0.2em] text-primary uppercase">Feedback</h2>
</div>
<!-- Content Area -->
<div class="px-6 py-4 space-y-6">
<!-- Category Selection -->
<p class="text-[11px] text-on-surface-variant/70 font-body leading-relaxed mb-4">
    If you are unsatisfied with the generation result, coins will be refunded after successful verification.
</p><div class="space-y-3">
<p class="font-label text-[11px] text-on-surface-variant tracking-wider uppercase">Select Category</p>
<div class="flex flex-wrap gap-2">
<!-- Selected State -->
<button class="px-4 py-2 rounded-[4px] bg-primary/10 border border-primary text-primary text-[12px] font-medium shadow-[0_0_15px_rgba(197,154,255,0.2)] transition-all">
                            AI Generation Quality
                        </button>
<button class="px-4 py-2 rounded-[4px] bg-surface-container-highest/40 border border-outline-variant/30 text-on-surface-variant text-[12px] font-medium hover:border-primary/50 hover:text-on-surface transition-all">
                            Poor Generation Result
                        </button>
<button class="px-4 py-2 rounded-[4px] bg-surface-container-highest/40 border border-outline-variant/30 text-on-surface-variant text-[12px] font-medium hover:border-primary/50 hover:text-on-surface transition-all">
                            Payment Issue
                        </button>
<button class="px-4 py-2 rounded-[4px] bg-surface-container-highest/40 border border-outline-variant/30 text-on-surface-variant text-[12px] font-medium hover:border-primary/50 hover:text-on-surface transition-all">
                            App Bug
                        </button>
<button class="px-4 py-2 rounded-[4px] bg-surface-container-highest/40 border border-outline-variant/30 text-on-surface-variant text-[12px] font-medium hover:border-primary/50 hover:text-on-surface transition-all">
                            Other
                        </button>
</div>
</div>
<!-- Text Input -->
<div class="space-y-3">
<p class="font-label text-[11px] text-on-surface-variant tracking-wider uppercase">Details</p>
<div class="relative group">
<textarea class="w-full border rounded-[4px] p-4 text-[13px] text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all resize-none bg-black/60 border-outline-variant/40" placeholder="Describe your issue in detail..." rows="4"></textarea>
<div class="absolute inset-0 rounded-[4px] pointer-events-none border border-primary/0 group-focus-within:border-primary/40 transition-all"></div>
</div>
</div>

<button class="w-full py-4 bg-gradient-to-br from-primary-dim to-primary text-on-primary font-headline font-extrabold text-[12px] tracking-[0.1em] shadow-[0_8px_24px_rgba(149,71,247,0.3)] hover:shadow-[0_12px_32px_rgba(149,71,247,0.4)] hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all rounded-full">

</div>

<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest">Gallery</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e6e3f5]/40 p-3">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-widest">Credits</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#c59aff]/10 text-[#c59aff] rounded-full p-3 shadow-[0_0_20px_rgba(197,154,255,0.15)]">
