name: iOS 构建

on:
  push:
    branches: [main, master]
    tags:
      - "tf-*"
  pull_request:
  # 手动：仓库页 → Actions → 左侧选「iOS 构建」→ 右侧「Run workflow」→ 选分支 → 勾选选项 → Run workflow
  workflow_dispatch:
    inputs:
      build_simulator:
        description: 编译模拟器 (Debug)
        type: boolean
        default: true
      upload_testflight:
        description: 归档、导出 IPA 并上传 TestFlight（需配置 ASC Secrets）
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: 模拟器编译
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_simulator == 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译 (iOS Simulator)
        run: |
          xcodebuild \
            -project bbb.xcodeproj \
            -scheme bbb \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 上传构建产物 (bbb.app)
        uses: actions/upload-artifact@v4
        with:
          name: bbb-simulator-debug
          path: DerivedData/Build/Products/Debug-iphonesimulator/bbb.app
          if-no-files-found: error

  # 需仓库 Secrets：APP_STORE_CONNECT_API_KEY_ID、APP_STORE_CONNECT_API_ISSUER_ID、
  # APP_STORE_CONNECT_API_KEY_P8_BASE64（.p8 文件内容经 base64，一行即可）
  release-testflight:
    name: 归档 / 导出 IPA / 上传 TestFlight
    runs-on: macos-15
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_testflight == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tf-'))
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 写入 App Store Connect API 私钥
        env:
          P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${P8_BASE64:-}" || { echo "缺少 Secret: APP_STORE_CONNECT_API_KEY_P8_BASE64"; exit 1; }
          echo -n "$P8_BASE64" | base64 -d > "${RUNNER_TEMP}/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/AuthKey.p8"

      - name: 归档并导出 IPA、上传 TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_API_KEY_ID:-}" || { echo "缺少 Secret: APP_STORE_CONNECT_API_KEY_ID"; exit 1; }
          test -n "${APP_STORE_CONNECT_API_ISSUER_ID:-}" || { echo "缺少 Secret: APP_STORE_CONNECT_API_ISSUER_ID"; exit 1; }
          ROOT="${GITHUB_WORKSPACE}"
          DERIVED="${ROOT}/DerivedData-release"
          ARCHIVE="${ROOT}/build/bbb.xcarchive"
          EXPORT="${ROOT}/build/export"
          mkdir -p "${ROOT}/build"
          rm -rf "$DERIVED" "$ARCHIVE" "$EXPORT"

          xcodebuild archive \
            -project "${ROOT}/bbb.xcodeproj" \
            -scheme bbb \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "${ROOT}/.github/ExportOptions-app-store.plist" \
            -allowProvisioningUpdates

          IPA=$(find "$EXPORT" -maxdepth 1 -name '*.ipa' | head -n 1)
          test -n "$IPA" || { echo "未找到 IPA"; ls -la "$EXPORT"; exit 1; }
          echo "IPA=$IPA"

          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: 上传 IPA 工件（备份）
        uses: actions/upload-artifact@v4
        with:
          name: bbb-ipa-testflight
          path: build/export/*.ipa
          if-no-files-found: error
