# 仅使用云端 Mac 构建并（可选）上传到 App Store Connect。
# 需要 GitHub 仓库 Secrets，见文件末尾注释。
#
# Runner：需带 Xcode 26 / iOS 26 SDK（例如 macos-26）。若标签不可用，将 runs-on 改为 macos-latest 并确认镜像已含 Xcode 26。
name: iOS App Store (CI)

on:
  workflow_dispatch:
    inputs:
      upload_to_connect:
        description: "导出 IPA 后是否上传到 App Store Connect（需配置 ASC_* Secrets）"
        type: boolean
        default: true

defaults:
  run:
    working-directory: Akarsu

concurrency:
  group: ios-appstore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      # 避免 brew 每次全量更新（常见 10～30+ 分钟）
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_ENV_HINTS: 1
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_TIMESTAMP: "true"
      FASTLANE_DISABLE_COLORS: "true"
      # 关闭索引以缩短 xcodebuild 时间（CI 不需要 Xcode 索引）
      COMPILER_INDEX_STORE_ENABLE: NO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-26 镜像已含 Xcode 26；若需固定小版本可取消注释下面两步并指定版本号
      # - uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: "26.2"

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Cache DerivedData (加速重复构建)
        uses: actions/cache@v4
        with:
          path: Akarsu/build/DerivedData
          key: ${{ runner.os }}-dd-appstore-${{ hashFiles('Akarsu/bbb/**/*.swift', 'Akarsu/bbb.xcodeproj/project.pbxproj', 'Akarsu/bbb/**/*.xcassets/**') }}
          restore-keys: |
            ${{ runner.os }}-dd-appstore-

      - name: Prepare keychain and signing
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::error::缺少 Repository secret：APPLE_CERT_P12_BASE64"
            echo "请在本仓库页面：Settings → Secrets and variables → Actions → 切到「Repository secrets」→ New repository secret 添加（名称须完全一致、区分大小写）。"
            echo "不要把证书填在「Variables」里；若在「Environments」里配置，本工作流默认读不到，除非给 job 绑定 environment。"
            echo "若暂时不需要签名 IPA，请改用工作流「iOS Build Package」（无需证书）。"
            exit 1
          fi
          test -n "${CERT_PASSWORD:-}" || { echo "::error::缺少 Repository secret：APPLE_CERT_PASSWORD"; exit 1; }
          test -n "${PROVISION_BASE64:-}" || { echo "::error::缺少 Repository secret：APPLE_PROVISION_PROFILE_BASE64"; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo "::error::缺少 Repository secret：APPLE_TEAM_ID"; exit 1; }

          KEYCHAIN_PATH="$PWD/build-ci.keychain-db"
          security create-keychain -p "" "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security unlock-keychain -p "" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"

          # macOS 使用 base64 -d（勿用 base64 --decode）；Secret 勿含多余换行
          CERT_P12_BASE64=$(printf '%s' "${CERT_P12_BASE64}" | tr -d '\n\r')
          PROVISION_BASE64=$(printf '%s' "${PROVISION_BASE64}" | tr -d '\n\r')
          printf '%s' "${CERT_P12_BASE64}" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "${KEYCHAIN_PATH}" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "${KEYCHAIN_PATH}"
          rm -f /tmp/dist.p12

          printf '%s' "${PROVISION_BASE64}" | base64 -d > /tmp/app.mobileprovision
          security cms -D -i /tmp/app.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/app.mobileprovision "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          {
            echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "PROFILE_UUID=${PROFILE_UUID}"
            echo "PROFILE_NAME<<GITHUB_PROFILE_NAME"
            echo "${PROFILE_NAME}"
            echo "GITHUB_PROFILE_NAME"
          } >> "${GITHUB_ENV}"

          echo "Installed provisioning profile: ${PROFILE_NAME} (${PROFILE_UUID})"

      - name: Resolve Distribution signing identity
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" || true
          LINE=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -E "Apple Distribution|iPhone Distribution" | head -1 || true)
          if [ -z "${LINE}" ]; then
            echo "::error::未在钥匙串中找到 Apple Distribution / iPhone Distribution 证书，请检查 APPLE_CERT_P12_BASE64 是否为分发证书。"
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" || true
            exit 1
          fi
          SIGN_IDENTITY=$(echo "${LINE}" | sed -n 's/.*"\(.*\)"/\1/p')
          echo "Using CODE_SIGN_IDENTITY=${SIGN_IDENTITY}"
          {
            echo "SIGN_IDENTITY<<GITHUB_SIGN_IDENTITY"
            echo "${SIGN_IDENTITY}"
            echo "GITHUB_SIGN_IDENTITY"
          } >> "${GITHUB_ENV}"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build build/DerivedData
          xcodebuild archive \
            -project bbb.xcodeproj \
            -scheme bbb \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -archivePath "$PWD/build/bbb.xcarchive" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=${SIGN_IDENTITY}" \
            "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/bbb.xcarchive" \
            -exportPath "$PWD/build/AppStoreExport" \
            -exportOptionsPlist "$PWD/ExportOptions-app-store-ci.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbb-app-store
          path: ${{ github.workspace }}/Akarsu/build/AppStoreExport/bbb.ipa
          if-no-files-found: error

      - name: Install fastlane
        if: ${{ inputs.upload_to_connect }}
        run: |
          set -euo pipefail
          gem install fastlane --no-document
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
          fastlane --version

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ inputs.upload_to_connect }}
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IPA_PATH: ${{ github.workspace }}/Akarsu/build/AppStoreExport/bbb.ipa
        run: |
          set -euo pipefail
          test -n "${ASC_KEY_ID:-}" && test -n "${ASC_ISSUER_ID:-}" && test -n "${ASC_PRIVATE_KEY:-}" || {
            echo "::error::已勾选上传但缺少 ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY"
            exit 1
          }
          KEY_DIR="${{ github.workspace }}/.asc_key"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "${ASC_PRIVATE_KEY}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export ASC_KEY_PATH="$KEY_FILE"
          cd Akarsu
          fastlane upload_connect

# -----------------------------------------------------------------------------
# 需在 GitHub：Settings → Secrets and variables → Actions 中配置：
#
# 签名（手动分发证书 + App Store / Distribution 描述文件）
#   APPLE_CERT_P12_BASE64   从「钥匙串访问」导出的 Apple Distribution 证书 .p12，再 base64
#   APPLE_CERT_PASSWORD     上述 .p12 的导出密码
#   APPLE_PROVISION_PROFILE_BASE64  App Store 类型描述文件 .mobileprovision 的 base64
#   APPLE_TEAM_ID           10 位 Team ID（与 Xcode 中一致，例如 MWZPAMZZHQ）
#
# 上传（App Store Connect API 密钥，角色需含「App 管理器」或更高）
#   ASC_KEY_ID              密钥 ID
#   ASC_ISSUER_ID           Issuer ID
#   ASC_PRIVATE_KEY         .p8 文件全文（含 BEGIN/END 行）
#
# 每次提交前请在工程中提高 CURRENT_PROJECT_VERSION（或 Marketing），避免与已有构建号冲突。
# -----------------------------------------------------------------------------
